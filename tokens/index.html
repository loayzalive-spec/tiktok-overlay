<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tokens del directo</title>

  <!--
    Misma fuente de pixel que el resto de overlays. Si OBS no tiene
    internet no pasa nada: style.css declara un fallback y solo se
    pierde la tipografia. Con "fuente": "normal" ni se usa.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Aqui SOLO salen los espectadores que tienen tokens sin gastar.
    El filtro lo hace el servidor (listWithTokens en src/tokens.ts),
    no esta pagina: lo que no se manda no se puede pintar por error.

    Si no hay nadie con saldo, el panel entero se esconde en vez de
    quedarse como un rectangulo oscuro vacio encima del juego.
  -->
  <div class="tk-panel" id="panel">
    <h2 class="tk-titulo" id="titulo" hidden></h2>
    <ol class="tk-lista" id="lista"></ol>
  </div>

  <script src="script.js"></script>
</body>
</html>
