<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Top del directo</title>

  <!--
    La misma fuente de pixel que el overlay del catalogo. Si OBS no
    tiene internet no pasa nada: style.css declara un fallback y solo
    se pierde la tipografia.
    Con "fuente": "normal" en config.json ni se usa.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    La MISMA pagina sirve para los dos overlays. Cual de las dos
    listas toca (monedas o likes) no lo decide una URL ni un
    parametro: lo dice el servidor que la esta sirviendo, en
    /api/lista. Asi el 5600 y el 5700 comparten archivo y cualquier
    arreglo vale para los dos.
  -->
  <div class="top-panel">
    <h2 class="top-titulo" id="titulo" hidden></h2>
    <ol class="top-lista" id="lista"></ol>
  </div>

  <script src="script.js"></script>
</body>
</html>
