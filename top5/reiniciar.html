<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reiniciar el top</title>

  <!--
    Pagina suelta, NO va en OBS: se abre a mano en el navegador
    (http://127.0.0.1:5600/reiniciar.html) cuando empieza otro
    directo y hay que poner el ranking a cero.

    El reinicio es un POST a proposito. Con un GET bastaria que el
    navegador precargara el enlace, o que alguien dejara la pestana
    abierta y se refrescara, para borrar el ranking sin querer.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14141a;
      color: #eee;
      font-family: system-ui, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .caja { max-width: 420px; }

    h1 { font-size: 20px; margin: 0 0 12px; }

    p { color: #aaa; line-height: 1.5; margin: 0 0 20px; font-size: 14px; }

    button {
      font: inherit;
      font-weight: 700;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #c0392b;
      color: #fff;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: default; }

    #aviso { margin-top: 16px; min-height: 22px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="caja">
    <h1>Reiniciar el top del directo</h1>
    <p>
      Pone a cero las monedas y los likes de todos los espectadores.
      No se puede deshacer.
    </p>

    <button id="btn" type="button">Poner el ranking a cero</button>

    <div id="aviso"></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const aviso = document.getElementById('aviso');

    btn.addEventListener('click', async () => {
      if (!confirm('¿Seguro? El ranking actual se pierde.')) return;

      btn.disabled = true;
      aviso.textContent = 'Reiniciando...';

      try {
        const res = await fetch('/api/top/reset', { method: 'POST' });
        const json = await res.json();

        aviso.textContent = json.success
          ? '✅ Listo, el ranking está a cero.'
          : '❌ No se pudo reiniciar.';
      } catch {
        aviso.textContent = '❌ La app no está levantada (run.bat).';
      }

      btn.disabled = false;
    });
  </script>
</body>
</html>
