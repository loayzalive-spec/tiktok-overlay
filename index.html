<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay Interacciones</title>

  <!--
    Fuentes de los skins (config.json -> "skin"): Press Start 2P
    (megaman), Luckiest Guy (mario64), Titan One (crash) y Cinzel
    (sotn). Si OBS no tiene internet no pasa nada: cada skin declara
    un fallback y solo se pierde la tipografia.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Luckiest+Guy&family=Titan+One&family=Cinzel:wght@700;900&display=swap">

  <link rel="stylesheet" href="style.css">

  <!-- Cada skin solo engancha con su data-skin en el <html>. -->
  <link rel="stylesheet" href="skins/mario64.css">
  <link rel="stylesheet" href="skins/crash.css">
  <link rel="stylesheet" href="skins/sotn.css">
</head>
<body>
  <div class="overlay-container">
    <div class="slider" id="slider"></div>
  </div>

  <!--
    Modo "catalog" (ver config.json -> "mode"). No reemplaza al
    slider de arriba: script.js elige uno u otro segun el modo y
    deja el que no se usa vacio/oculto. El slider viejo no se toca.
  -->
  <div class="catalog-container" id="catalogContainer" hidden>
    <!--
      Cada equipo es una columna con su titulo opcional arriba y su
      cuadricula debajo. El titulo sale de config.json
      (catalogConfig.bueno.title / .malo.title); si no esta, script.js
      deja el <div> vacio y oculto y la cuadricula ocupa todo el alto,
      igual que antes de que existieran los titulos.
    -->
    <div class="catalog-team" id="catalogTeamBueno">
      <div class="catalog-title catalog-title-bueno" id="catalogTitleBueno" hidden></div>
      <div class="catalog-column catalog-column-bueno" id="catalogBueno"></div>
    </div>

    <div class="catalog-team" id="catalogTeamMalo">
      <div class="catalog-title catalog-title-malo" id="catalogTitleMalo" hidden></div>
      <div class="catalog-column catalog-column-malo" id="catalogMalo"></div>
    </div>

    <!--
      catalogConfig.layout = "unico": un solo cuadro con buenos y
      malos mezclados, distinguidos solo por el color del borde de
      cada tarjeta. Con "equipos" (o sin el campo) queda oculto.
    -->
    <div class="catalog-team" id="catalogTeamUnico" hidden>
      <div class="catalog-title catalog-title-unico" id="catalogTitleUnico" hidden></div>
      <div class="catalog-column catalog-column-unico" id="catalogUnico"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
